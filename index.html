<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <link rel="icon" type="image/png" href="./images/favicon-32x32.png">
</head>

<body>

<main class="container">

  <form id="contactForm" novalidate>

    <h1>Contact Us</h1>

    <div class="row">

      <div class="form-group">
        <label for="firstName">First Name *</label>
        <input id="firstName" type="text" autocomplete="name"/>
        <p class="error" id="firstNameError"></p>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name *</label>
        <input id="lastName" type="text" autocomplete="family-name"/>
        <p class="error" id="lastNameError"></p>
      </div>

    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input id="email" type="email" autocomplete="email"/>
      <p class="error" id="emailError"></p>
    </div>

    <fieldset class="query">

      <legend>Query Type *</legend>

      <div class="query-options">

        <label class="radio">
          <input type="radio" name="query" />
          <span class="custom-radio"></span>
          General Enquiry
        </label>

        <label class="radio">
          <input type="radio" name="query" />
          <span class="custom-radio"></span>
          Support Request
        </label>

      </div>

      <p class="error" id="queryError"></p>
    </fieldset>

    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message"></textarea>
      <p class="error" id="messageError"></p>
    </div>

    <label class="checkbox">
      <input type="checkbox" id="consent" />
      <span class="custom-checkbox"></span>
      I hereby consent to being contacted by the team *
    </label>

    <p class="error" id="consentError"></p>

    <button type="submit">Submit</button>

  </form>

  <div class="toast hidden" role="status" aria-live="polite">
    <img src="./images/icon-success-check.svg" alt="success check" />
    <h2>Message sent!</h2>
    <p>Thanks for completing this form. We'll be in touch soon!</p>
  </div>

</main>


</body>
</html>
